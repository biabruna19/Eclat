<!DOCTYPE html>
<html lang="pt-BR" data-raiz="./">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joias · Éclat Joias</title>
    <meta name="description" content="Colares, brincos, anéis, relógios e braceletes da Éclat Joias.">
    <meta name="author" content="Beatriz Oliveira">
    <meta name="theme-color" content="#fff8f1">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/loja.css?v=202611261543">
</head>
<body>
<div id="topo"></div>
<main id="conteudo" class="container">
    <nav class="trilha" aria-label="Você está em" id="trilha"></nav>
    <div class="banner-colecao" id="banner" hidden><img id="bannerImg" src="" alt="" width="1500" height="500"></div>

    <div class="cabeca-colecao">
        <div>
            <span class="sobretitulo" id="sobre"></span>
            <h1 id="titulo">Joias</h1>
            <p id="descricao"></p>
        </div>
    </div>

    <div class="filtros">
        <div class="abas" id="abas" role="group" aria-label="Coleção"></div>
        <div class="filtros-dir">
            <label class="marcar"><input type="checkbox" id="soDisponiveis"> Só disponíveis</label>
            <label class="sr-only" for="ordem">Ordenar</label>
            <select id="ordem">
                <option value="destaques">Destaques</option>
                <option value="menor">Menor preço</option>
                <option value="maior">Maior preço</option>
                <option value="nome">Nome (A–Z)</option>
            </select>
            <span class="contagem" id="contagem" aria-live="polite"></span>
        </div>
    </div>

    <div class="grade-produtos" id="grade"></div>
    <div style="height:80px"></div>
</main>
<div id="rodape"></div>
<script src="./js/catalogo.js?v=202611261543"></script>
<script src="./js/loja.js?v=202611261543"></script>
<script src="./js/paginas/colecao.js?v=202611261543"></script>

</body>
</html>
