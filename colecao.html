<!DOCTYPE html>
<html lang="pt-BR" data-raiz="./">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joias · Éclat Joias</title>
    <meta name="description" content="Colares, brincos, anéis, relógios e braceletes da Éclat Joias.">
    <meta name="author" content="Beatriz Oliveira">
    <meta name="theme-color" content="#fbf8f3">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/loja.css?v=202611261701">
</head>
<body>
<div id="topo"></div>
<main id="conteudo" class="container">
    <nav class="trilha" aria-label="Você está em" id="trilha"></nav>
    <div class="cabeca-colecao">
        <span class="sobretitulo" id="sobre"></span>
        <h1 id="titulo">Joias</h1>
        <p id="descricao"></p>
    </div>
    <div class="colecao-faixa" id="faixa" hidden></div>

    <div class="filtros">
        <div class="abas" id="abas" role="group" aria-label="Coleção"></div>
        <div class="filtros-dir">
            <label class="marcar"><input type="checkbox" id="soDisponiveis"> Só disponíveis</label>
            <label class="sr-only" for="ordem">Ordenar</label>
            <select id="ordem">
                <option value="destaques">Destaques</option>
                <option value="menor">Menor preço</option>
                <option value="maior">Maior preço</option>
                <option value="nome">Nome (A–Z)</option>
            </select>
            <span class="contagem" id="contagem" aria-live="polite"></span>
        </div>
    </div>

    <div class="grade-produtos" id="grade"></div>
    <div style="height:120px"></div>
</main>
<div id="rodape"></div>
<script src="./js/catalogo.js?v=202611261701"></script>
<script src="./js/loja.js?v=202611261701"></script>
<script src="./js/paginas/colecao.js?v=202611261701"></script>

</body>
</html>
